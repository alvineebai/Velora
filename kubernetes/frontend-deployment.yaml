apiVersion: apps/v1
kind: Deployment

metadata:
  name: velora-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: velora-frontend

  template:
    metadata:
      labels:
        app: velora-frontend

    spec:
      containers:
        - name: frontend
          image: veloradevregistry.azurecr.io/velora-frontend:v1

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10