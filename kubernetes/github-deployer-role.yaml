
apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: velora-deployer
  namespace: default

rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]

  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
