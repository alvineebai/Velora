apiVersion: batch/v1
kind: Job
metadata:
  name: velora-db-seed
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: postgres:16
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              psql -v ON_ERROR_STOP=1 -f /sql/seed.sql
          env:
            - name: PGHOST
              value: velora-db-dev.postgres.database.azure.com
            - name: PGDATABASE
              value: velora
            - name: PGUSER
              value: veloraadmin
            - name: PGSSLMODE
              value: require
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: velora-db-admin-credentials
                  key: password
          volumeMounts:
            - name: sql-scripts
              mountPath: /sql
      volumes:
        - name: sql-scripts
          configMap:
            name: velora-db-sql