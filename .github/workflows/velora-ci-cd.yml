
name: Velora CI/CD

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build and Push Velora Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker installation
        run: docker --version

      - name: Build backend image
        run: docker build -t velora-backend:test ./app/backend

      - name: Build frontend image
        run: docker build -t velora-frontend:test ./app/frontend

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name veloradevregistry

      - name: Tag backend image
        run: |
          docker tag velora-backend:test \
            veloradevregistry.azurecr.io/velora-backend:${{ github.sha }}

      - name: Tag frontend image
        run: |
          docker tag velora-frontend:test \
            veloradevregistry.azurecr.io/velora-frontend:${{ github.sha }}

      - name: Push backend image
        run: |
          docker push \
            veloradevregistry.azurecr.io/velora-backend:${{ github.sha }}

      - name: Push frontend image
        run: |
          docker push \
            veloradevregistry.azurecr.io/velora-frontend:${{ github.sha }}

  deploy:
    name: Deploy Velora to AKS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group velora-dev-rg \
            --name velora-dev-aks \
            --overwrite-existing

      - name: Install kubelogin
        run: az aks install-cli

      - name: Configure Kubernetes authentication
        run: kubelogin convert-kubeconfig -l azurecli

      - name: Set application image versions
        run: |
          sed -i "s|velora-backend:v1|velora-backend:${{ github.sha }}|g" kubernetes/backend-deployment.yaml
          sed -i "s|velora-frontend:v1|velora-frontend:${{ github.sha }}|g" kubernetes/frontend-deployment.yaml

      - name: Deploy applications
        run: |
          kubectl apply -f kubernetes/configmap.yaml
          kubectl apply -f kubernetes/backend-deployment.yaml
          kubectl apply -f kubernetes/backend-service.yaml
          kubectl apply -f kubernetes/frontend-deployment.yaml
          kubectl apply -f kubernetes/frontend-service.yaml

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/velora-backend --timeout=180s
          kubectl rollout status deployment/velora-frontend --timeout=180s
